name: Flood Monitor Pipeline (legacy, manual only)

# TEMPORARY RUNNER — NON CANONICAL
# Canonical source: Inlift-Tecnologia/sentinel@5c2730ce094ff25ea1c67141bd0f07f090c4f1cf
#
# Schedule removido nesta mesma entrega que ativa pipeline-critical.yml e
# pipeline-heavy.yml, para evitar dual writer (dois pipelines diferentes
# escrevendo nas mesmas tabelas ao mesmo tempo). Este workflow usa o
# pipeline monolítico legado (scraping HTML da Defesa Civil, sem Asthon) e
# fica disponível apenas via workflow_dispatch para referência/debug.

on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run pipeline once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m src.coleta.executar_pipeline_once